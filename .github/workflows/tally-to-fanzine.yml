name: Recuperation Automatique Tally
on:
  schedule:
    - cron: '*/15 * * * *' # S'exécute toutes les 15 minutes
  workflow_dispatch: # Permet de le lancer à la main pour tester

jobs:
  get_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch Tally Responses
        run: |
          # On récupère les données publiques du formulaire
          curl -s "https://api.tally.so/forms/441GVB/submissions" > data.json
          
          # Ici, on vérifie si on a reçu quelque chose
          if [ ! -s data.json ]; then echo "Pas de données"; exit 0; fi

      - name: Create Files
        run: |
          # Ce script simplifié va créer un fichier pour chaque réponse
          # (Note : nécessite que le formulaire soit public ou accessible)
          # Pour ce test, on va juste créer un fichier horodaté
          mkdir -p content/fanzines
          echo "Dernière vérification le $(date)" > content/fanzines/last_check.txt

      - name: Commit and Push
        run: |
          git config --global user.name "Tally Bot"
          git config --global user.email "bot@tally.so"
          git add .
          git commit -m "Mise à jour automatique des fanzines" || exit 0
          git push
